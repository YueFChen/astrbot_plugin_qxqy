<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1280px;
      height: 720px;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* 背景图 - 使用关卡封面图 */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-image: url({{bg_url}});
      background-size: cover;
      background-position: center center;
    }

    /* 渐变遮罩 - 增强可读性 */
    .gradient-layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        rgba(0,0,0,0.7) 0%,
        rgba(0,0,0,0.5) 40%,
        rgba(0,0,0,0.3) 60%,
        transparent 100%);
    }

    /* 边框光环 */
    .border-ring {
      position: absolute;
      inset: 0;
      border-radius: 0;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
      pointer-events: none;
    }

    /* 内容容器 - 左侧布局 */
    .content {
      position: absolute;
      top: 50%;
      left: 48px;
      transform: translateY(-50%);
      max-width: 520px;
      color: white;
      z-index: 10;
    }

    /* 关卡ID标签 */
    .level-id-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid rgba(110, 231, 183, 0.3);
      background: rgba(110, 231, 183, 0.15);
      color: #6ee7b7;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    /* 关卡名称 */
    .level-name {
      font-family: Georgia, 'Noto Serif SC', 'Times New Roman', serif;
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 24px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      letter-spacing: -1px;
      line-height: 1.15;
    }

    /* 统计数据区域 */
    .stats {
      display: flex;
      gap: 32px;
      margin-bottom: 24px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255,255,255,0.98);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* 关卡简介 - 磨砂玻璃效果 */
    .intro-box {
      position: relative;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    /* 底层：磨砂玻璃背景 */
    .intro-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 1;
    }

    /* 顶层：渐变遮罩 */
    .intro-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
        rgba(255,255,255,0.06) 0%,
        rgba(255,255,255,0.02) 50%,
        transparent 100%);
      z-index: 2;
    }

    .intro {
      position: relative;
      z-index: 3;
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255,255,255,0.95);
    }

    /* 底部标签区 */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 20px;
    }

    .tags {
      display: flex;
      gap: 16px;
    }

    .tag {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
    }

    .brand {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 多层背景实现玻璃拟态 -->
    <div class="bg-layer"></div>
    <div class="gradient-layer"></div>
    <div class="border-ring"></div>

    <!-- 内容区 - 左侧布局 -->
    <div class="content">
      <!-- 关卡ID标签 -->
      <div class="level-id-tag">ID: {{level_id}}</div>

      <!-- 关卡名称 -->
      <h1 class="level-name">{{level_name}}</h1>

      <!-- 统计数据 -->
      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">热度</span>
          <span class="stat-value">{{hot_score}}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">好评率</span>
          <span class="stat-value">{{good_rate}}</span>
        </div>
      </div>

      <!-- 关卡简介 -->
      <div class="intro-box">
        <p class="intro">{{level_intro}}</p>
      </div>

      <!-- 底部标签 -->
      <div class="footer">
        <div class="tags">
          <span class="tag">千星奇域</span>
          <span class="tag">关卡查询</span>
        </div>
        <span class="brand">AstrBot</span>
      </div>
    </div>
  </div>
</body>
</html>
